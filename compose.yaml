version: '3.8'

services:
  # PostgreSQL 数据库服务
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docker_agent_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docker_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API 服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker_agent_api
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/docker_agent
      - APP_ENV=development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
