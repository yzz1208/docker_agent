name: docker-agent-prod

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: docker/Dockerfile.backend
  image: docker-support-agent-backend:${IMAGE_TAG:-local}
  env_file:
    - .env.production
  environment:
    APP_ENV: production
    APP_HOST: 0.0.0.0
    APP_PORT: 8000
    DATABASE_URL: >-
      postgresql+psycopg://${POSTGRES_USER:-docker_agent}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-docker_agent}
    EMBEDDING_CACHE_DIR: /app/.cache/huggingface
    EMBEDDING_DEVICE: ${CONTAINER_EMBEDDING_DEVICE:-cpu}
    RERANK_CACHE_DIR: /app/.cache/huggingface
    RERANK_DEVICE: ${CONTAINER_RERANK_DEVICE:-cpu}
    RERANK_USE_FP16: ${CONTAINER_RERANK_USE_FP16:-false}
    TOOL_MODE: ${TOOL_MODE:-mock}
  volumes:
    - model_cache:/app/.cache/huggingface

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docker_agent}
      POSTGRES_USER: ${POSTGRES_USER:-docker_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-docker_agent} -d ${POSTGRES_DB:-docker_agent}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend-common
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rag-schema:
    <<: *backend-common
    command:
      - python
      - -c
      - >-
        from docker_agent.rag.store import init_vector_store;
        engine = init_vector_store();
        engine.dispose()
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    <<: *backend-common
    depends_on:
      rag-schema:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: docker-support-agent-web:${IMAGE_TAG:-local}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8080/health/ready >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_prod_data:
  model_cache:
